[package]
name = "serenity-core"
version = "0.12.5"
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Serenity workspace crates
serenity-http = { path = "../serenity-http", default-features = false, optional = true }
serenity-utils = { path = "../serenity-utils" }

# Workspace dependencies
aformat = { workspace = true }
arrayvec = { workspace = true }
bytes = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
extract_map = { workspace = true }
futures = { workspace = true, optional = true }
nonmax = { workspace = true }
parking_lot = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
small-fixed-array = { workspace = true }
strum = { workspace = true }
to-arraystring = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
typesize = { workspace = true, optional = true }
url = { workspace = true }

# Required dependencies
base64 = "0.22.1"
bitflags = "2.10.0"
bool_to_bitflags = "0.1.3"
ref-cast = "1.0.25"
serde_cow = "0.1.2"

# Optional dependencies
foldhash = { version = "0.2.0", optional = true }
mini-moka = { version = "0.10.3", optional = true }

[features]
builder = ["bytes"]
cache = ["dashmap", "foldhash", "parking_lot"]
http = ["serenity-http", "percent-encoding", "reqwest"]
model = ["builder", "http", "utils", "futures"]
utils = []
chrono = ["serenity-utils/chrono"]
typesize = [
    "dep:typesize",
    "serenity-http?/typesize",
    "serenity-utils/typesize",
    "dashmap/typesize",
    "small-fixed-array/typesize",
    "bool_to_bitflags/typesize",
    "extract_map/typesize"
]

unstable = []
tracing_instrument = ["serenity-http?/tracing_instrument", "tracing/attributes"]
tokio_task_builder = ["serenity-utils/tokio_task_builder"]

temp_cache = ["cache", "mini-moka", "typesize?/mini_moka", "typesize?/dashmap"]

rustls_backend = ["serenity-http?/rustls_backend"]
rustls_backend_no_provider = ["serenity-http?/rustls_backend_no_provider"]
native_tls_backend = ["serenity-http?/native_tls_backend"]
